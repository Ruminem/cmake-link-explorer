<!-- Activity bar icon. Monochrome on purpose: VS Code recolours it per theme, so
     it has to read as a silhouette. Same chain-link shape as the gallery icon in
     media/icon-gallery.svg, which colours the two halves to say what links this
     and what this links. -->
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
    <path d="M10.2 6.4 H8.4 a5.6 5.6 0 0 0 0 11.2 h1.8"/>
    <path d="M13.8 6.4 h1.8 a5.6 5.6 0 0 1 0 11.2 h-1.8"/>
    <path d="M8.6 12 H15.4"/>
  </g>
</svg>
